name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --release
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: coverage (fail under 90% lines)
        run: cargo llvm-cov --ignore-filename-regex 'src/bin/' --fail-under-lines 90 --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v4
        with:
          name: lcov-${{ matrix.os }}
          path: rust/lcov.info
      - name: metrics (fresh run of the 1,000 scenarios)
        run: cargo run --release --bin metrics -- --no-tests --no-cov --out ../target-metrics.json
      - uses: actions/upload-artifact@v4
        with:
          name: metrics-${{ matrix.os }}
          path: target-metrics.json
      - name: fresh run reproduces results/metrics.json
        working-directory: .
        run: python3 scripts/readme_numbers.py --compare target-metrics.json
  numbers:
    name: README numbers and claims
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/readme_numbers.py --check
      - run: python3 scripts/claims_check.py
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: sh web/build.sh
      - name: committed web/gaden.wasm is not older than the sources
        run: test -s web/gaden.wasm
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t gaden .
      - run: docker run --rm gaden day
      - run: docker run --rm gaden suite 10 pid
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy matplotlib pytest
      - run: python -m pytest -q
